name: Build Cinespice Android APK
on:
  workflow_dispatch:
  push:
    branches: [android, 'coderabbit/android-app-build/**']
    paths: ['android/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults include the retired SDK package "tools".
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Fetch pinned TDLib binaries
        run: ./prepare-tdlib.sh
      - name: Test, lint, and build installable APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintOptimized :app:assembleOptimized
      - uses: actions/upload-artifact@v4
        with:
          name: Cinespice-Android-arm64-v8a
          path: android/app/build/outputs/apk/optimized/app-arm64-v8a-optimized.apk
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Cinespice-Android-armeabi-v7a
          path: android/app/build/outputs/apk/optimized/app-armeabi-v7a-optimized.apk
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Cinespice-Android-x86_64
          path: android/app/build/outputs/apk/optimized/app-x86_64-optimized.apk
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cinespice-Android-diagnostics
          path: |
            android/app/build/reports/
            android/app/build/outputs/mapping/optimized/
          if-no-files-found: ignore
